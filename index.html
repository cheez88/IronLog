<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>IronLog</title>
  <meta name="description" content="Track lifts and runs, see progress, and know when to add weight." />
  <meta name="theme-color" content="#14161A" />
  <meta name="color-scheme" content="dark" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="favicon-64.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon-v2.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="IronLog" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="fonts.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; background: #14161A; overflow-x: hidden; overflow-x: clip; overscroll-behavior-y: none; }
    body { -webkit-text-size-adjust: 100%; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    input, textarea, button, select { -webkit-tap-highlight-color: transparent; }
    button, select { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    input:focus, textarea:focus, select:focus { border-color: #E8472B !important; outline: none; }
    /* Shown only until React mounts, so the app never flashes white */
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #14161A; }
    #boot img { width: 96px; height: 96px; border-radius: 22px; }
  </style>
  <script src="react.production.min.js"></script>
  <script src="react-dom.production.min.js"></script>
  <script src="prop-types.min.js"></script>
  <script src="recharts.min.js"></script>
</head>
<body>
  <div id="root"><div id="boot"><img src="icon-192.png" alt="" /></div></div>

<script src="app.js"></script>
</body>
</html>
